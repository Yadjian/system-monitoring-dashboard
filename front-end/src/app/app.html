<h1>Dashboard Monitoring</h1>

<div *ngIf="metrics">
  <h2>CPU</h2>
  <p>Température : {{ metrics.cpu?.temperature }} °C</p>
  <p>Utilisation : {{ metrics.cpu?.usage }} %</p>

  <h2>RAM</h2>
  <p>Utilisation : {{ metrics.ram?.usage }} %</p>
</div>

<div *ngIf="!metrics">
  <p>Chargement des données...</p>
</div>
